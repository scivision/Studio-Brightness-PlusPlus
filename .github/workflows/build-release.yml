name: Build and upload release

permissions:
    contents: write

on:
    push:
        tags:
            - "v*"

jobs:
    build-release:
        runs-on: windows-2025
        timeout-minutes: 15

        strategy:
           matrix:
             arch: [ x64 ]

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: true
                  fetch-depth: 0

            # The tag is the single source of truth for the version. Strip the leading "v"
            # (e.g. v2.2.0 -> 2.2.0, v2.2.0-beta.1 -> 2.2.0-beta.1) and hand it to the build,
            # which generates include/version.h from it (tools/gen-version.ps1).
            - name: Derive version from tag
              shell: bash
              run: echo "SBPP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            - name: Setup WiX Toolset
              timeout-minutes: 5
              run: |
                  dotnet tool install --global wix --version 7
                  wix eula accept wix7
                  wix extension add --global WixToolset.UI.wixext

            # from https://github.com/libass/libass/blob/0.17.5/.github/workflows/meson.yml#L118-L125
            - name: Setup MSVC
              run: |
                $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                if (-not $vsPath) { throw "Could not find a Visual Studio installation" }
                "VS=$vsPath"
                "VS=$vsPath" >> $env:GITHUB_ENV

            - name: Build exe
              shell: cmd
              run: |
                cmake -Bbuild -G "Visual Studio 18 2026" -A ${{ matrix.arch }}
                cmake --build build --config Release

            - name: Build MSI
              run:  cpack --config build/CPackConfig.cmake

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      build/bin/studio-brightness-plusplus-*.msi
                      build/bin/studio-brightness-plusplus.exe
                  # A tag containing a hyphen (v2.2.0-beta.1) is a pre-release; v2.2.0 is stable.
                  prerelease: ${{ contains(github.ref_name, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
