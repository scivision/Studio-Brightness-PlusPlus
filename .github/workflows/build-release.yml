name: Build and upload release

permissions:
    contents: write

on:
    push:
        tags:
            - "v*"

jobs:
    build-release:
        runs-on: windows-2025
        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                arch: [x64, ARM64]

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: true
                  fetch-depth: 0

            # The tag is the single source of truth for the version. Strip the leading "v"
            # (e.g. v2.2.0 -> 2.2.0, v2.2.0-beta.1 -> 2.2.0-beta.1) and hand it to the build,
            # which generates include/version.h from it (tools/gen-version.ps1).
            - name: Derive version from tag
              shell: bash
              run: echo "SBPP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

            - name: Setup WiX Toolset
              timeout-minutes: 5
              run: |
                  dotnet tool install --global wix --version 7
                  wix eula accept wix7
                  wix extension add --global WixToolset.UI.wixext

            # from https://github.com/libass/libass/blob/0.17.5/.github/workflows/meson.yml#L118-L125
            - name: Setup MSVC
              run: |
                $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                $vsPath = & $vswhere -latest -products * -property installationPath
                if (-not $vsPath) { throw "Could not find a Visual Studio installation" }
                "VS=$vsPath"
                "VS=$vsPath" >> $env:GITHUB_ENV

            - name: Build exe
              shell: cmd
              run: |
                cmake -B build -G "Visual Studio 18 2026" -A ${{ matrix.arch }}
                cmake --build build --config Release

            - name: Build MSI
              run: cpack --config build/CPackConfig.cmake

            - name: Stage release files
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force dist | Out-Null
                  Copy-Item "build/bin/studio-brightness-plusplus.exe" "dist/studio-brightness-plusplus-${{ matrix.arch }}.exe"
                  Get-ChildItem "build/bin" -Filter "studio-brightness-plusplus-*.msi" | ForEach-Object {
                      Copy-Item $_.FullName "dist/studio-brightness-plusplus-${{ matrix.arch }}.msi"
                  }

            - name: Upload release artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: studio-brightness-plusplus-${{ matrix.arch }}
                  path: dist/**
                  if-no-files-found: error

    release:
        needs: build-release
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')

        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@v7
              with:
                  path: dist

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      dist/**/studio-brightness-plusplus-*.exe
                      dist/**/studio-brightness-plusplus-*.msi
                  # A tag containing a hyphen (v2.2.0-beta.1) is a pre-release; v2.2.0 is stable.
                  prerelease: ${{ contains(github.ref_name, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
